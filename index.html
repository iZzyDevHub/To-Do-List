<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <p id="title">To-Do List</p>
    <div id="input-place">
        <input id="taskInput" type="text" name="Task" placeholder="Type your task here">
        <button id="add-task-btn" type="button">Add</button>
    </div>

    <div id="task-list-output">
        <ul id="list"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
